[package]
name = "unionc-agent"
version = "0.1.0"
edition = "2024"
description = "Read-only cross-platform host telemetry agent for UnionC"
license = "MIT OR Apache-2.0"

[features]
default = ["otlp", "nvidia"]
otlp = ["dep:prost"]
nvidia = ["dep:nvml-wrapper"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
flate2 = "1"
nvml-wrapper = { version = "0.12", optional = true }
prost = { version = "0.14", optional = true }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
