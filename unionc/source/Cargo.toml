[package]
name = "unionc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
bcrypt = "0.15"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx-core = { version = "0.8", default-features = false, features = ["chrono", "_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "0.8", default-features = false, features = ["chrono"] }
sysinfo = "0.39"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
# 0.13: rustls 成为默认 TLS 后端，feature 名从 rustls-tls 改为 rustls
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
